<!DOCTYPE html>
<html lang="en">
<head>
{{- partial "head.html" . -}}
</head>
<body class="page-{{ if .IsHome }}home{{ else if .File }}{{ .File.ContentBaseName }}{{ else }}{{ .Kind }}{{ end }}">
    <a class="fn-skip-link" href="#main">Skip to main content</a>
    {{- partial "header.html" . -}}
    <main id="main" tabindex="-1">
        {{- block "main" . }}{{- end }}
    </main>
    {{- partial "footer.html" . -}}
    {{- partial "scripts.html" . -}}
</body>
</html>
